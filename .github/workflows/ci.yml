name: CI
on:
  push: {branches: [main, "feature/**"]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: platform, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://platform:platform@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements-dev.txt
      - name: Install SDK + agent packages (so tests/agent_* run, not skip)
        run: pip install -e agents/platform_sdk -e agents/agent_1_saas_research -e agents/agent_2_local_leads
      - run: pytest
      - name: OpenAPI schema is up to date (contract drift check)
        working-directory: backend
        env: {DJANGO_SECRET_KEY: ci-schema-only}
        run: python manage.py spectacular --file /tmp/openapi.yaml && diff -u ../docs/openapi.yaml /tmp/openapi.yaml
      - name: Migrations are up to date
        working-directory: backend
        env: {DJANGO_SECRET_KEY: ci-schema-only}
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: API types match OpenAPI contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
