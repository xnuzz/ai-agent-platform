[project]
name = "platform-sdk"
version = "1.0.0"
description = "Client SDK for agents talking to the central platform backend (Agent API v1)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["platform_sdk"]
