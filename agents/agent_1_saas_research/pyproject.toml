[project]
name = "saas-research"
version = "0.1.0"
description = "Agent 1 (SAAS_RESEARCH): SaaS opportunity research + customer research worker for the platform."
requires-python = ">=3.11"
dependencies = [
    "platform-sdk>=1.0",          # agents/platform_sdk (install it first or in the same pip command)
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "anthropic>=2.6,<3",
]

[project.scripts]
saas-research = "saas_research.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saas_research*"]
