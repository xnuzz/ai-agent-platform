          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteRequestRequest'
      security:
      - AgentToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTask'
          description: ''
  /api/v1/agent/tasks/{task_id}/fail/:
