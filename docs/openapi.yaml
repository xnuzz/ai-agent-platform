  /api/v1/audit-events/:
    get:
      operationId: v1_audit_events_list
      description: |-
        Scopes a DRF view to the workspace in the X-Workspace-ID header.

        Sets request.workspace / request.membership and filters querysets by workspace.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - AGENT
          - SYSTEM
          - USER
        description: |-
          * `USER` - User
          * `AGENT` - Agent
          * `SYSTEM` - System
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
          format: uuid
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - v1
