components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActorTypeEnum:
      enum:
      - USER
      - AGENT
      - SYSTEM
      type: string
      description: |-
        * `USER` - User
        * `AGENT` - Agent
        * `SYSTEM` - System
    AddressItemRequest:
      type: object
      properties:
        line1:
          type: string
          default: ''
          maxLength: 300
        city:
          type: string
          default: ''
          maxLength: 120
        region:
          type: string
          default: ''
          maxLength: 120
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country_code:
          type: string
          default: ''
          maxLength: 2
    AgentTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        agent:
          allOf:
          - $ref: '#/components/schemas/AgentTypeEnum'
          readOnly: true
        task_type:
          allOf:
          - $ref: '#/components/schemas/TaskTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatusEnum'
          readOnly: true
        input:
          readOnly: true
        attempt:
          type: integer
          readOnly: true
        max_attempts:
          type: integer
          readOnly: true
        lease_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        lease_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_requested:
          type: boolean
          readOnly: true
        context:
          type: object
          additionalProperties: {}
          description: Read-only data the agent needs that lives in the backend (approved
            idea for customer research).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent
      - attempt
      - cancel_requested
      - context
      - created_at
      - id
      - input
      - lease_expires_at
      - lease_id
      - max_attempts
      - status
      - task_type
      - workspace_id
    AgentTypeEnum:
      enum:
      - SAAS_RESEARCH
      - LOCAL_LEADS
      type: string
      description: |-
        * `SAAS_RESEARCH` - Agent 1 - SaaS Opportunity Research
        * `LOCAL_LEADS` - Agent 2 - Local Business Lead Finder
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        target_type:
          allOf:
          - $ref: '#/components/schemas/ApprovalTargetTypeEnum'
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
          default: PENDING
        research_task:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        requested_by_type:
          allOf:
          - $ref: '#/components/schemas/ActorTypeEnum'
          readOnly: true
        requested_by_user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        requested_by_agent:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
        content_hash:
          type: string
          readOnly: true
        decided_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        decided_by_email:
          type: string
          format: email
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_comment:
          type: string
          readOnly: true
        decision_options:
          readOnly: true
        outcome:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
