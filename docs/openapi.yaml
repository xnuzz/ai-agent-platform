openapi: 3.0.3
info:
  title: Unified AI SaaS Platform API
  version: 1.0.0
  description: 'Central backend API. Contract source of truth: docs/API_CONTRACTS.md.'
paths:
  /api/v1/agent/suppression/check/:
    post:
      operationId: v1_agent_suppression_check_create
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuppressionCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuppressionCheckRequest'
        required: true
      security:
      - AgentToken: []
      responses:
        '200':
          description: '{"suppressed_emails": [...], "suppressed_phones": [...]}'
  /api/v1/agent/tasks/{task_id}/:
    get:
      operationId: v1_agent_tasks_retrieve
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agent
      security:
      - AgentToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTask'
          description: ''
  /api/v1/agent/tasks/{task_id}/complete/:
    post:
      operationId: v1_agent_tasks_complete_create
      parameters:
      - in: header
        name: X-Lease-Id
        schema:
          type: string
        description: lease_id returned by claim
        required: true
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agent
      requestBody:
        content:
          application/json:
            schema:
