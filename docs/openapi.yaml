  /api/v1/approvals/:
    get:
      operationId: v1_approvals_list
      description: Approval Center. Decisions are human-only (JWT users with DEVELOPER+
        role).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: requested_by_agent
        schema:
          type: string
      - in: query
        name: research_task
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - CANCELLED
          - CHANGES_REQUESTED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `CHANGES_REQUESTED` - Changes Requested
          * `CANCELLED` - Cancelled
      - in: query
        name: target_id
        schema:
          type: string
          format: uuid
      - in: query
        name: target_type
        schema:
          type: string
          enum:
          - CAMPAIGN
          - PROJECT_BRIEF
          - SOFTWARE_IDEA
        description: |-
          * `SOFTWARE_IDEA` - Software Idea
          * `PROJECT_BRIEF` - Project Brief
          * `CAMPAIGN` - Campaign
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalList'
          description: ''
  /api/v1/approvals/{id}/:
    get:
      operationId: v1_approvals_retrieve
      description: Approval Center. Decisions are human-only (JWT users with DEVELOPER+
        role).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval.
        required: true
      tags:
