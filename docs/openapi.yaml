      description: |-
        Scopes a DRF view to the workspace in the X-Workspace-ID header.

        Sets request.workspace / request.membership and filters querysets by workspace.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project_brief
        schema:
          type: string
          format: uuid
      - in: query
        name: research_task
        schema:
          type: string
          format: uuid
      - in: query
        name: software_idea
        schema:
          type: string
          format: uuid
      - in: query
        name: source
        schema:
          type: string
          enum:
          - LOCAL_LEADS
          - MANUAL
          - SAAS_RESEARCH
        description: |-
          * `SAAS_RESEARCH` - Agent 1
          * `LOCAL_LEADS` - Agent 2
          * `MANUAL` - Manual (user)
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - APPROVED
          - CANCELLED
          - CHANGES_REQUESTED
          - COMPLETED
          - DRAFT
          - PAUSED
          - REJECTED
          - WAITING_FOR_APPROVAL
        description: |-
          * `DRAFT` - Draft
          * `WAITING_FOR_APPROVAL` - Waiting For Approval
          * `APPROVED` - Approved
          * `CHANGES_REQUESTED` - Changes Requested
          * `REJECTED` - Rejected
          * `ACTIVE` - Active
          * `PAUSED` - Paused
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
